name: nutrinight-ai

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-nutrinight}
      POSTGRES_USER: ${POSTGRES_USER:-nutrinight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_HOST_PORT:-5440}:5432"
    volumes:
      - nutrinight-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-nutrinight} -d ${POSTGRES_DB:-nutrinight}"]
      interval: 5s
      timeout: 5s
      retries: 20

  ai-service:
    build: ./ai-service
    restart: unless-stopped
    environment:
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY:?Set AI_SERVICE_API_KEY in .env}
      LOG_LEVEL: INFO
    ports:
      - "${AI_SERVICE_PORT:-8001}:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      ai-service:
        condition: service_healthy
    environment:
      BACKEND_PORT: 8085
      # Service names (not localhost) are used for container-to-container traffic.
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-nutrinight}
      DB_USERNAME: ${POSTGRES_USER:-nutrinight}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      AI_SERVICE_URL: http://ai-service:8001
      AI_SERVICE_API_KEY: ${AI_SERVICE_API_KEY}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      NUTRINIGHT_TIMEZONE: ${NUTRINIGHT_TIMEZONE:-Asia/Kolkata}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    ports:
      - "${BACKEND_PORT:-8085}:8085"
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8085/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  nutrinight-pgdata:
