spring:
  application:
    name: nutrinight-backend
  config:
    # Local development convenience: read ../.env (repo root) when it exists.
    # Real environment variables always take precedence over this file.
    import: optional:file:../.env[.properties],optional:file:./.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5440/nutrinight}
    username: ${DB_USERNAME:nutrinight}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: 10
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false
    generator:
      write-bigdecimal-as-plain: true

server:
  port: ${BACKEND_PORT:8085}
  error:
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

logging:
  level:
    root: INFO
    com.nutrinight: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n"

nutrinight:
  # Time zone in which order times are interpreted when they carry no UTC offset,
  # and in which the late-night window is evaluated.
  timezone: ${NUTRINIGHT_TIMEZONE:Asia/Kolkata}
  late-night:
    start: "22:00"   # inclusive
    end: "04:00"     # exclusive
  privacy:
    # Groups (e.g. cities) with fewer orders than this are suppressed in aggregated outputs.
    min-group-size: 10
  upload:
    max-file-size-bytes: 10485760
    max-rows: 200000
    max-reported-errors: 100
    preview-rows: 20
  ai:
    base-url: ${AI_SERVICE_URL:http://localhost:8001}
    api-key: ${AI_SERVICE_API_KEY:}
    connect-timeout: 3s
    read-timeout: 60s
    max-analysis-records: 200000
  security:
    admin-username: ${ADMIN_USERNAME:admin}
    admin-password: ${ADMIN_PASSWORD:}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5180,http://localhost:3000}
  nutrition-thresholds:
    source: >-
      UK Department of Health & Food Standards Agency (2016), "Guide to creating a front of pack (FoP)
      nutrition label for pre-packed products sold through retail outlets" - per 100 g / 100 ml criteria.
      Sodium limits derived from salt limits (sodium = salt / 2.5). Applied to restaurant dishes for
      exploratory purposes only.
    source-url: https://www.gov.uk/government/publications/front-of-pack-nutrition-labelling-guidance
    food:
      sugar-g: { low: 5.0, high: 22.5 }
      saturated-fat-g: { low: 1.5, high: 5.0 }
      sodium-mg: { low: 120, high: 600 }
    drinks:
      sugar-g: { low: 2.5, high: 11.25 }
      saturated-fat-g: { low: 0.75, high: 2.5 }
      sodium-mg: { low: 120, high: 300 }
